<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
 <main class="container bg-gray-100 mx-auto mt-10 p-10 flex gap-10 flex-col">
  <!--1st Assignment from Flex-->
  <section class="flex gap-10 bg-gray-200 p-10">
  <div class="flex justify-self-start space-x-10">
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
  </div>

  <div class="flex ml-auto space-x-10">
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
  </div>

  <div class="flex ml-auto space-x-10">
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
</div>
</section>

    <!--2nd Assignment from Flex-->
  <section class="flex gap-10 bg-gray-200 p-10 justify-around">
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
  </section>

  <!--3rd Assignment from Flex-->
<section class="flex gap-10 bg-gray-200 p-10 justify-center">
  <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
</section>

  <!--4th Assignment from Flex-->
<section class="flex gap-10 bg-gray-200 justify-center p-10">
    <div class="bg-red-400 w-20 h-20 rounded"></div>
    <div class="bg-red-400 w-20 h-20 basis-1/3 rounded"></div>
    <div class="bg-red-400 w-20 h-20 rounded"></div>
</section>

  <!--5th Assignment from Flex-->
<section class="flex gap-10 bg-gray-200 p-10">
  <div class="bg-red-400 w-20 h-20 rounded basis-1/3"></div>
  <div class="ml-auto flex space-x-10">
    <div class="w-20 h-20 bg-red-400 rounded"></div>
    <div class="w-20 h-20 bg-red-400 rounded"></div>
  </div>
</section>

    <div class="flex gap-10 bg-gray-200 p-10 justify-around">
      <!-- Outer Box -->
      <div class="flex justify-around items-center w-11/12 h-20 bg-gray-400 rounded-md">
        <!-- Red Boxes on Left -->
        <div class="flex space-x-2">
          <div class="w-16 h-16 bg-red-400 rounded"></div>
          <div class="w-16 h-16 bg-red-400 rounded"></div>
          <div class="w-16 h-16 bg-red-400 rounded"></div>
        </div>
        <!-- Orange Box in Center -->
        <div class="flex justify-center items-center h-screen">
          <div class="w-60 min-h-16 bg-gray-300 flex justify-center items-center">
            <div class="flex space-x-12">
              <input type="radio" name="option" class="w-4 h-4 accent-white ">
              <input type="radio" name="option" class="w-4 h-4 accent-white">
              <input type="radio" name="option" class="w-4 h-4 accent-white">
            </div>
          </div>
        </div>
      
        <!-- Red Boxes on Right -->
        <div class="flex space-x-2">
          <div class="w-16 h-16 bg-red-400 rounded"></div>
          <div class="w-16 h-16 bg-red-400 rounded"></div>
          <div class="w-16 h-16 bg-red-400 rounded"></div>
        </div>
      </div>
      <!-- Single Box on Right -->
      <div class="w-20 h-20 bg-red-400 rounded ml-4"></div>
    </div>

  </section>
</body>
 </main>
</html>
